name: Build macOS apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/check_public_tree.py
      - run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
          body: |
            Developer preview. Full local backups and synthetic regression tests are included.
            Pick arm64 for Apple Silicon or x64 for Intel. Builds are ad-hoc signed, not Apple-notarized.
            Password preparation is a separate explicit CSV step requiring Zen's native importer.
            Read the compatibility and recovery guides before using important browser data.
