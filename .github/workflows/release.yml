name: Build macOS apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          from arc_to_zen import __version__
          assert os.environ["RELEASE_TAG"] == "v" + __version__, "Release tag and package version must match"
          PYTHON
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/check_public_tree.py
      - run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          name: arc_to_zen ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body_path: docs/releases/${{ github.ref_name }}.md
