[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arc2zen-bridge"
version = "0.1.0"
description = "A local-first macOS bridge from Arc spaces to verified Zen profiles."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["lz4>=4.4,<5", "cryptography>=45,<51", "PySide6-Essentials>=6.12,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6.12,<7"]

[project.scripts]
arc2zen-bridge = "arc2zen_bridge.cli:main"
arc2zen-bridge-app = "arc2zen_bridge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
